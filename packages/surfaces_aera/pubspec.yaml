name: surfaces_aera
description: The AERA Recovery backend for package:surfaces, on top of aera_flutter (back gesture, safe area, keyboard) and the app's own Rust library.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  surfaces:
    path: ../surfaces
  aera_flutter:
    path: ../../aera_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
