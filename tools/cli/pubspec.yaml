name: surfaces_cli
description: The surfaces dev CLI. Builds a surfaces app for every target (KernelSU / WebUI X module, hosted web, AERA, Linux) and serves a WebUI build in a browser with a fake root-manager host at any tier.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  args: ^2.5.0
  path: ^1.9.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

executables:
  surfaces: surfaces
