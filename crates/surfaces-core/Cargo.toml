[package]
name = "surfaces-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Host-neutral pieces every surfaces app shares: the ops protocol, shell quoting, WebUI naming rules and hashing. Pure Rust, builds for native and wasm."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
